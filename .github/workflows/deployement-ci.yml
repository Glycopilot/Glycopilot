name: Master Deployment Pipeline

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      deploy_plan_a:
        description: '1. Déployer Backend sur Plan A (EC2)'
        type: boolean
        default: false
      deploy_plan_plus:
        description: '1b. Déployer Plan Plus sur ECS'
        type: boolean
        default: false
      deploy_front_web:
        description: '2. Déployer Frontend Web (S3)'
        type: boolean
        default: false
      deploy_landing_page:
        description: '2b. Déployer Site Vitrine (S3 statique)'
        type: boolean
        default: false
      deploy_mobile:
        description: '3. Compiler App Mobile (Expo EAS)'
        type: boolean
        default: false

env:
  AWS_REGION: eu-west-3
  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || secrets.PUBLIC_API_URL }}
  PUBLIC_WS_URL: ${{ vars.PUBLIC_WS_URL || secrets.PUBLIC_WS_URL }}
  S3_BUCKET_FRONTEND: ${{ vars.S3_BUCKET_FRONTEND || secrets.S3_BUCKET_FRONTEND }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  S3_BUCKET_LANDING_PAGE: ${{ vars.S3_BUCKET_LANDING_PAGE || secrets.S3_BUCKET_LANDING_PAGE || 'glycopilot-fr-landing' }}
  S3_LANDING_PREFIX: ${{ vars.S3_LANDING_PREFIX || '' }}
  LANDING_PUBLIC_URL: ${{ vars.LANDING_PUBLIC_URL || 'https://www.glycopilot.fr' }}
  LANDING_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.LANDING_CLOUDFRONT_DISTRIBUTION_ID || secrets.LANDING_CLOUDFRONT_DISTRIBUTION_ID || 'E31HMYRP8OYSCT' }}
  S3_BUCKET_MEDIA: ${{ vars.S3_BUCKET_MEDIA || secrets.S3_BUCKET_MEDIA }}
  PLAN_PLUS_ECS_CLUSTER: ${{ vars.PLAN_PLUS_ECS_CLUSTER || 'glycopilot-plan-plus-cluster' }}
  PLAN_PLUS_ECS_SERVICE: ${{ vars.PLAN_PLUS_ECS_SERVICE || 'glycopilot-plan-plus-service' }}
  PLAN_PLUS_ALB_URL: ${{ vars.PLAN_PLUS_ALB_URL || 'https://api.glycopilot.tech' }}

jobs:
  deploy-plan-a:
    name: Deploy Plan A (EC2)
    if: ${{ inputs.deploy_plan_a }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare container image names
        id: images
        run: |
          REPOSITORY_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=ghcr.io/${REPOSITORY_LC}/glycopilot-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ai_service_image=ghcr.io/${REPOSITORY_LC}/glycopilot-ai-service:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.images.outputs.backend_image }}
          cache-from: type=gha,scope=glycopilot-backend
          cache-to: type=gha,mode=max,scope=glycopilot-backend

      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai_service
          push: true
          tags: ${{ steps.images.outputs.ai_service_image }}
          cache-from: type=gha,scope=glycopilot-ai-service
          cache-to: type=gha,mode=max,scope=glycopilot-ai-service

      - name: Sync repository to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          AI_ENV_FILE: ${{ secrets.AI_ENV_FILE }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          AI_SERVICE_IMAGE: ${{ steps.images.outputs.ai_service_image }}
          RUNTIME_DB_HOST: ${{ vars.RUNTIME_DB_HOST || secrets.RUNTIME_DB_HOST }}
          RUNTIME_DB_PORT: ${{ vars.RUNTIME_DB_PORT || secrets.RUNTIME_DB_PORT }}
          RUNTIME_DB_NAME: ${{ vars.RUNTIME_DB_NAME || secrets.RUNTIME_DB_NAME }}
          RUNTIME_DB_USER: ${{ vars.RUNTIME_DB_USER || secrets.RUNTIME_DB_USER }}
          RUNTIME_DB_PASSWORD: ${{ secrets.RUNTIME_DB_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | sed 's/\r$//' > ~/.ssh/glycopilot_ec2_key
          chmod 600 ~/.ssh/glycopilot_ec2_key

          SSH_OPTS="-i $HOME/.ssh/glycopilot_ec2_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

          runtime_db_values=0
          runtime_db_missing=""
          if [ -n "${RUNTIME_DB_HOST:-}" ]; then runtime_db_values=$((runtime_db_values + 1)); else runtime_db_missing="${runtime_db_missing} RUNTIME_DB_HOST"; fi
          if [ -n "${RUNTIME_DB_PORT:-}" ]; then runtime_db_values=$((runtime_db_values + 1)); else runtime_db_missing="${runtime_db_missing} RUNTIME_DB_PORT"; fi
          if [ -n "${RUNTIME_DB_NAME:-}" ]; then runtime_db_values=$((runtime_db_values + 1)); else runtime_db_missing="${runtime_db_missing} RUNTIME_DB_NAME"; fi
          if [ -n "${RUNTIME_DB_USER:-}" ]; then runtime_db_values=$((runtime_db_values + 1)); else runtime_db_missing="${runtime_db_missing} RUNTIME_DB_USER"; fi
          if [ -n "${RUNTIME_DB_PASSWORD:-}" ]; then runtime_db_values=$((runtime_db_values + 1)); else runtime_db_missing="${runtime_db_missing} RUNTIME_DB_PASSWORD"; fi

          if [ "$runtime_db_values" -ne 0 ] && [ "$runtime_db_values" -ne 5 ]; then
            echo "RDS runtime configuration is incomplete."
            echo "Set all of RUNTIME_DB_HOST, RUNTIME_DB_PORT, RUNTIME_DB_NAME, RUNTIME_DB_USER and RUNTIME_DB_PASSWORD, or set none."
            echo "Missing values:${runtime_db_missing}"
            exit 1
          fi

          reject_placeholders() {
            file="$1"
            label="$2"
            invalid_keys="$(
              awk -F= '
                /^[[:space:]]*#/ || /^[[:space:]]*$/ { next }
                $1 ~ /^[A-Za-z_][A-Za-z0-9_]*$/ {
                  value=$0
                  sub(/^[^=]*=/, "", value)
                  if (value ~ /^<[^>]+>$/ || value ~ /ta_secret_key|your-secret|changeme|CHANGE_ME|REPLACE_ME|TODO/) {
                    print $1
                  }
                }
              ' "$file" | sort -u | tr '\n' ' '
            )"
            if [ -n "$invalid_keys" ]; then
              echo "$label contains placeholder values for keys: $invalid_keys"
              exit 1
            fi
          }

          reject_secret_var() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            case "$value" in
              \<*\>|*ta_secret_key*|*your-secret*|*changeme*|*CHANGE_ME*|*REPLACE_ME*|*TODO*)
                echo "$name contains a placeholder value."
                exit 1
                ;;
            esac
          }

          reject_secret_var RUNTIME_DB_PASSWORD "${RUNTIME_DB_PASSWORD:-}"

          ssh \
            $SSH_OPTS \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p /home/ubuntu/glycopilot-app"

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'backend/.env' \
            --exclude 'backend/.env.prod' \
            --exclude 'ai_service/.env' \
            --exclude 'ai_service/.env.prod' \
            --exclude 'node_modules/' \
            --exclude 'frontend_web/node_modules/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'backend/db.sqlite3' \
            --exclude 'backend/media/' \
            -e "ssh -i ~/.ssh/glycopilot_ec2_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30" \
            ./ "$EC2_USERNAME@$EC2_HOST:/home/ubuntu/glycopilot-app/"

          printf '%s\n' "$PROD_ENV_FILE" > backend/.env.prod.raw
          reject_placeholders backend/.env.prod.raw PROD_ENV_FILE

          if [ "$runtime_db_values" -eq 5 ]; then
            grep -Ev '^(DB_NAME|DB_USER|DB_PASSWORD|POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD|DB_HOST|DB_PORT|DB_SSLMODE)=' \
              backend/.env.prod.raw > backend/.env.prod || true
          else
            cp backend/.env.prod.raw backend/.env.prod
          fi
          {
            if [ -n "${RUNTIME_DB_NAME:-}" ]; then printf 'DB_NAME=%s\n' "$RUNTIME_DB_NAME"; fi
            if [ -n "${RUNTIME_DB_USER:-}" ]; then printf 'DB_USER=%s\n' "$RUNTIME_DB_USER"; fi
            if [ -n "${RUNTIME_DB_PASSWORD:-}" ]; then printf 'DB_PASSWORD=%s\n' "$RUNTIME_DB_PASSWORD"; fi
          } >> backend/.env.prod
          printf '%s\n' "$AI_ENV_FILE" > ai_service/.env.prod
          reject_placeholders ai_service/.env.prod AI_ENV_FILE
          {
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'AI_SERVICE_IMAGE=%s\n' "$AI_SERVICE_IMAGE"
            if [ -n "${RUNTIME_DB_HOST:-}" ]; then printf 'DB_HOST=%s\n' "$RUNTIME_DB_HOST"; fi
            if [ -n "${RUNTIME_DB_PORT:-}" ]; then printf 'DB_PORT=%s\n' "$RUNTIME_DB_PORT"; fi
            if [ -n "${RUNTIME_DB_HOST:-}" ]; then printf 'DB_SSLMODE=require\n'; fi
          } > .env
          scp $SSH_OPTS backend/.env.prod "$EC2_USERNAME@$EC2_HOST:/home/ubuntu/glycopilot-app/backend/.env.prod"
          scp $SSH_OPTS ai_service/.env.prod "$EC2_USERNAME@$EC2_HOST:/home/ubuntu/glycopilot-app/ai_service/.env.prod"
          scp $SSH_OPTS .env "$EC2_USERNAME@$EC2_HOST:/home/ubuntu/glycopilot-app/.env"

      - name: Execute deployment on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd /home/ubuntu/glycopilot-app

            sudo install -m 0755 infra/ec2-watchdog/glycopilot-healthcheck.sh /usr/local/sbin/glycopilot-healthcheck
            sudo install -m 0644 infra/ec2-watchdog/glycopilot-healthcheck.env /etc/default/glycopilot-healthcheck
            sudo install -m 0644 infra/ec2-watchdog/glycopilot-healthcheck.service /etc/systemd/system/glycopilot-healthcheck.service
            sudo install -m 0644 infra/ec2-watchdog/glycopilot-healthcheck.timer /etc/systemd/system/glycopilot-healthcheck.timer
            sudo systemctl daemon-reload

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose --profile aws pull backend_aws ai_service_aws medication_scheduler_aws nginx
            docker logout ghcr.io || true
            docker compose --profile aws up -d --no-build database_aws redis_aws
            if docker compose --profile aws config | grep -q 'DB_HOST: .*rds.amazonaws.com'; then
              echo "Checking RDS credentials from deployed env files before backend restart..."
              docker run --rm \
                --env-file backend/.env.prod \
                --env-file .env \
                postgres:16-alpine \
                sh -c 'PGPASSWORD="$DB_PASSWORD" psql "host=$DB_HOST port=$DB_PORT dbname=$DB_NAME user=$DB_USER sslmode=require" -c "select current_database(), current_user;" >/dev/null'
            fi
            docker compose --profile aws up -d --no-build --force-recreate backend_aws ai_service_aws medication_scheduler_aws nginx
            docker compose --profile aws exec -T backend_aws python manage.py shell -c "from apps.profiles.models import Role; [Role.objects.get_or_create(name=r) for r in ['SUPERADMIN','ADMIN','PATIENT','DOCTOR']]"
            docker compose --profile aws exec -T backend_aws python manage.py shell -c "from apps.doctors.models.status import VerificationStatus, InvitationStatus; [VerificationStatus.objects.get_or_create(label=s) for s in ['PENDING','VERIFIED','REJECTED']]; [InvitationStatus.objects.get_or_create(label=s) for s in ['PENDING','ACTIVE','REJECTED','ENDED']]"
            docker compose --profile aws ps
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/; then
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Backend healthcheck failed after retries"
                docker compose --profile aws ps
                docker compose --profile aws logs --tail=100 backend_aws nginx
                exit 1
              fi

              sleep 5
            done
            docker compose --profile aws exec -T backend_aws python manage.py db_runtime_check
            sudo systemctl start glycopilot-healthcheck.service
            sudo systemctl enable --now glycopilot-healthcheck.timer
            docker image prune -f

  deploy-plan-plus:
    name: Deploy Plan Plus (ECS)
    if: ${{ inputs.deploy_plan_plus }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare container image names
        id: images
        run: |
          REPOSITORY_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=ghcr.io/${REPOSITORY_LC}/glycopilot-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ai_service_image=ghcr.io/${REPOSITORY_LC}/glycopilot-ai-service:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.images.outputs.backend_image }}
          cache-from: type=gha,scope=glycopilot-backend
          cache-to: type=gha,mode=max,scope=glycopilot-backend

      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai_service
          push: true
          tags: ${{ steps.images.outputs.ai_service_image }}
          cache-from: type=gha,scope=glycopilot-ai-service
          cache-to: type=gha,mode=max,scope=glycopilot-ai-service

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new ECS task definition revision
        id: task
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          AI_SERVICE_IMAGE: ${{ steps.images.outputs.ai_service_image }}
        run: |
          set -euo pipefail

          current_task_definition="$(
            aws ecs describe-services \
              --cluster "$PLAN_PLUS_ECS_CLUSTER" \
              --services "$PLAN_PLUS_ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query 'taskDefinition' \
            --output json > /tmp/current-task-definition.json

          jq \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg ai_service_image "$AI_SERVICE_IMAGE" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions = (
              .containerDefinitions
              | map(
                if .name == "backend" then .image = $backend_image
                elif .name == "ai_service" then .image = $ai_service_image
                else .
                end
              )
            )' \
            /tmp/current-task-definition.json > /tmp/next-task-definition.json

          new_task_definition="$(
            aws ecs register-task-definition \
              --cli-input-json file:///tmp/next-task-definition.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "task_definition=$new_task_definition" >> "$GITHUB_OUTPUT"
          echo "Registered $new_task_definition"

          {
            echo "### Plan Plus ECS task definition"
            echo ""
            echo "- Backend image: \`$BACKEND_IMAGE\`"
            echo "- AI service image: \`$AI_SERVICE_IMAGE\`"
            echo "- Task definition: \`$new_task_definition\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Plan Plus ECS service
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$PLAN_PLUS_ECS_CLUSTER" \
            --service "$PLAN_PLUS_ECS_SERVICE" \
            --task-definition "${{ steps.task.outputs.task_definition }}" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "$PLAN_PLUS_ECS_CLUSTER" \
            --services "$PLAN_PLUS_ECS_SERVICE"

      - name: Smoke test Plan Plus ALB
        run: |
          set -euo pipefail

          curl -fsS "$PLAN_PLUS_ALB_URL/"

          {
            echo "### Plan Plus smoke test"
            echo ""
            echo "- ALB URL: \`$PLAN_PLUS_ALB_URL/\`"
            echo "- Result: OK"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-front-web:
    name: Deploy Frontend Web
    if: ${{ inputs.deploy_front_web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build for Production
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          cd frontend_web
          npm install --legacy-peer-deps

          export REACT_APP_API_URL="${PUBLIC_API_URL:-https://api.glycopilot.tech/api}"
          export REACT_APP_API_TIMEOUT="10000"
          echo "Building frontend_web with REACT_APP_API_URL=$REACT_APP_API_URL"

          npm run build
          grep -R "$REACT_APP_API_URL" build/static/js >/dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          if [ -z "$S3_BUCKET_FRONTEND" ]; then
            echo "S3_BUCKET_FRONTEND repository variable is required."
            exit 1
          fi

          aws sts get-caller-identity
          aws s3api head-bucket --bucket "$S3_BUCKET_FRONTEND"
          aws s3 sync ./frontend_web/build/ s3://${S3_BUCKET_FRONTEND}/ --delete
          aws s3 ls s3://${S3_BUCKET_FRONTEND}/ --recursive --summarize
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          fi

          {
            echo "### Frontend web deployment"
            echo ""
            echo "- Bucket: \`$S3_BUCKET_FRONTEND\`"
            echo "- Website endpoint: \`http://${S3_BUCKET_FRONTEND}.s3-website.${AWS_REGION}.amazonaws.com\`"
            echo "- Public URL: \`https://www.glycopilot.tech\`"
            if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
              echo "- CloudFront invalidation: \`$CLOUDFRONT_DISTRIBUTION_ID\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-landing-page:
    name: Deploy Landing Page
    if: ${{ inputs.deploy_landing_page }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static landing page
        run: |
          rm -rf /tmp/glycopilot-landing
          mkdir -p /tmp/glycopilot-landing/assets

          cp landing_page/index.html /tmp/glycopilot-landing/index.html
          cp landing_page/styles.css /tmp/glycopilot-landing/styles.css
          cp landing_page/script.js /tmp/glycopilot-landing/script.js

          cp frontend/assets/favicon.png /tmp/glycopilot-landing/assets/favicon.png
          cp frontend/assets/glycopilot.png /tmp/glycopilot-landing/assets/glycopilot.png

          sed -i 's#../frontend/assets/#./assets/#g' /tmp/glycopilot-landing/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync landing page to S3
        run: |
          LANDING_BUCKET="$S3_BUCKET_LANDING_PAGE"
          LANDING_PREFIX="${S3_LANDING_PREFIX:-}"

          if [ -z "$LANDING_BUCKET" ]; then
            echo "S3_BUCKET_LANDING_PAGE repository variable is required for glycopilot.fr."
            exit 1
          fi

          LANDING_PREFIX="${LANDING_PREFIX#/}"
          LANDING_PREFIX="${LANDING_PREFIX%/}"

          if [ -n "$LANDING_PREFIX" ]; then
            DESTINATION="s3://${LANDING_BUCKET}/${LANDING_PREFIX}/"
          else
            DESTINATION="s3://${LANDING_BUCKET}/"
          fi

          aws sts get-caller-identity
          aws s3api head-bucket --bucket "$LANDING_BUCKET"
          aws s3 sync /tmp/glycopilot-landing/ "$DESTINATION" --delete
          aws s3 ls "$DESTINATION" --recursive --summarize
          if [ -n "$LANDING_CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$LANDING_CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          fi

          {
            echo "### Landing page deployment"
            echo ""
            echo "- Bucket: \`$LANDING_BUCKET\`"
            echo "- Destination: \`$DESTINATION\`"
            echo "- Public URL: \`$LANDING_PUBLIC_URL\`"
            if [ -n "$LANDING_CLOUDFRONT_DISTRIBUTION_ID" ]; then
              echo "- CloudFront invalidation: \`$LANDING_CLOUDFRONT_DISTRIBUTION_ID\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-mobile:
    name: Build Mobile App (Expo EAS)
    if: ${{ inputs.deploy_mobile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Create google-services.json and force tracking
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cd frontend

          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

          sed -i '/google-services.json/d' .gitignore || true

          git config --global user.email "ci@glycopilot.com"
          git config --global user.name "GitHub Actions"
          git add google-services.json .gitignore
          git commit -m "chore: temp commit for EAS to track google-services.json" || true

      - name: Build Android APK
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          cd frontend
          export EXPO_PUBLIC_API_URL="${PUBLIC_API_URL:-https://api.glycopilot.tech/api}"
          export EXPO_PUBLIC_WS_URL="${PUBLIC_WS_URL:-wss://api.glycopilot.tech/ws}"
          export EXPO_PUBLIC_S3_BUCKET="${S3_BUCKET_MEDIA:-glycopilot-target-data-bucket}"
          node - <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.apk.env = {
            ...(eas.build.apk.env || {}),
            EXPO_PUBLIC_API_URL: process.env.EXPO_PUBLIC_API_URL,
            EXPO_PUBLIC_WS_URL: process.env.EXPO_PUBLIC_WS_URL,
            EXPO_PUBLIC_S3_BUCKET: process.env.EXPO_PUBLIC_S3_BUCKET,
